name: Rotate social card

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick this week's image and update index.html
        run: |
          IMAGES=("card-finney.png" "card-breaking-news.png" "card-satoshi-statue.png" "card-saylor.png")
          WEEK=$(date +%V)
          INDEX=$(( (10#$WEEK) % 4 ))
          NEW_IMAGE="${IMAGES[$INDEX]}"
          NEW_URL="https://bitcoinhistorynewsletter.com/assets/social-cards/${NEW_IMAGE}"
          echo "Rotating to: $NEW_URL"
          sed -i -E "s#(content=\")https://bitcoinhistorynewsletter\.com/assets/social-cards/[^\"]+#\1${NEW_URL}#g" index.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet index.html; then
            git add index.html
            git commit -m "Rotate weekly social card"
            git push
          else
            echo "No change needed"
          fi
